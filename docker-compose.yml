services:
  wordle-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wordle-app:latest
    container_name: wordle-app
    ports:
      - "5002:80"       # acceso local directo
    restart: unless-stopped
    networks:
      - wordle-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  peerjs:
    image: peerjs/peerjs-server:latest
    container_name: wordle-peerjs
    command: ["--port", "9000", "--path", "/peerjs"]
    ports:
      - "9000:9000"     # acceso local directo
    networks:
      - wordle-net
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wordle-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - wordle-net
    restart: unless-stopped

networks:
  wordle-net:
    driver: bridge
